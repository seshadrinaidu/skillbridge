spring.application.name=skillbridge-ai-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillbridge_ai?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=skillbridge-ai

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.auth.cookie-name=SKILLBRIDGE_AUTH

springdoc.swagger-ui.path=/swagger-ui.html
spring.ai.openai.api-key=${OPENAI_API_KEY:test}
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.vectorstore.pinecone.enabled=false
spring.ai.vectorstore.pinecone.api-key=test
spring.ai.vectorstore.pinecone.index-name=skillbridge-test

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
