spring.application.name=skillbridge-ai-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:skillbridge;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-that-is-at-least-32-characters
app.jwt.expiration-ms=3600000
app.jwt.issuer=skillbridge-ai
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.frontend-base-url=http://localhost:3000
app.auth.cookie-name=SKILLBRIDGE_AUTH

spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.ai.openai.api-key=test
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.vectorstore.pinecone.enabled=false
spring.ai.vectorstore.pinecone.api-key=test
spring.ai.vectorstore.pinecone.index-name=skillbridge-test

management.endpoints.web.exposure.include=health,info
